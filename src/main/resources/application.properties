spring.application.name=sistema-automotivo
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_automotivo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
